<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1">
        <animate attributeName="stop-color" values="#0F172A;#1E293B;#0F172A" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1">
        <animate attributeName="stop-color" values="#1E293B;#334155;#1E293B" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Animated Coin Circle -->
  <circle cx="32" cy="28" r="14" fill="url(#coinGradient)" filter="url(#glow)">
    <animate attributeName="r" values="14;15;14" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Dollar Sign -->
  <g transform="translate(32, 28)">
    <!-- Vertical line -->
    <rect x="-1.5" y="-10" width="3" height="20" fill="#0F172A" rx="1.5">
      <animate attributeName="height" values="20;22;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-11;-10" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- S Shape -->
    <path d="M -6,-6 Q -8,-8 -4,-9 Q 2,-10 6,-8 Q 8,-6 6,-4 Q 2,-2 -2,-2 Q -6,-2 -6,0 Q -6,2 -2,2 Q 2,2 6,4 Q 8,6 6,8 Q 2,10 -4,9 Q -8,8 -6,6" 
          fill="none" 
          stroke="#0F172A" 
          stroke-width="2.5" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
  
  <!-- Floating Sparkles -->
  <circle cx="20" cy="20" r="1.5" fill="#06B6D4">
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;16;20" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="44" cy="22" r="1.5" fill="#8B5CF6">
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="22;18;22" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="18" cy="40" r="1.5" fill="#10B981">
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;36;40" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom Text Effect -->
  <text x="32" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#06B6D4" text-anchor="middle" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    $$$
  </text>
</svg>
